<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>@neelxz Doodle Pad</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        cursive: ['Pacifico', 'cursive'],
                    },
                    colors: {
                        neon: {
                            pink: '#ff2a6d',
                            cyan: '#05d9e8',
                            purple: '#b721ff',
                            green: '#01ffc3',
                            yellow: '#ffb300'
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        'pulse-glow': {
                            '0%, 100%': { opacity: 1, boxShadow: '0 0 15px currentColor' },
                            '50%': { opacity: .7, boxShadow: '0 0 5px currentColor' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #050914;
            background-image: 
                radial-gradient(at 0% 0%, rgba(183, 33, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(5, 217, 232, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            overscroll-behavior: none;
            touch-action: none;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none; /* Crucial for custom touch drawing */
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom styling for the native color picker */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            padding: 0;
            background: transparent;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
            transition: transform 0.2s;
        }
        input[type="color"]:hover {
            transform: scale(1.1);
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
        }

        .color-swatch {
            transition: all 0.2s ease;
        }
        .color-swatch.active {
            transform: scale(1.2);
            box-shadow: 0 0 15px currentColor;
            border-color: white;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col text-slate-200 overflow-hidden">

    <!-- Header -->
    <header class="absolute top-0 left-0 w-full p-4 md:p-6 z-10 pointer-events-none flex justify-end items-center">
        <!-- Replay Animation Button -->
        <button id="replay-btn" class="glass-panel p-3 rounded-full pointer-events-auto hover:bg-slate-800 transition-colors group" title="Replay Animation">
            <svg class="w-5 h-5 text-slate-300 group-hover:text-neon-cyan group-hover:-rotate-180 transition-all duration-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
        </button>
    </header>

    <!-- Canvas Area -->
    <main id="canvas-container" class="flex-1">
        <canvas id="doodle-canvas"></canvas>
    </main>

    <!-- Floating Toolbar -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 w-[95%] max-w-md pointer-events-auto">
        <div class="glass-panel p-4 rounded-3xl shadow-2xl flex items-center justify-between gap-4 animate-float">
            
            <!-- Tools -->
            <div class="flex items-center gap-2 md:gap-3 bg-slate-900/50 p-2 rounded-2xl border border-slate-700/50">
                <button class="color-swatch active w-8 h-8 rounded-full bg-neon-cyan text-neon-cyan border-2 border-transparent shadow-[0_0_10px_currentColor]" data-color="#05d9e8"></button>
                <button class="color-swatch w-8 h-8 rounded-full bg-neon-pink text-neon-pink border-2 border-transparent" data-color="#ff2a6d"></button>
                <button class="color-swatch w-8 h-8 rounded-full bg-neon-purple text-neon-purple border-2 border-transparent" data-color="#b721ff"></button>
                <button class="color-swatch w-8 h-8 rounded-full bg-neon-green text-neon-green border-2 border-transparent hidden sm:block" data-color="#01ffc3"></button>
                <button class="color-swatch w-8 h-8 rounded-full bg-neon-yellow text-neon-yellow border-2 border-transparent hidden sm:block" data-color="#ffb300"></button>
                <button class="color-swatch w-8 h-8 rounded-full bg-white text-white border-2 border-transparent" data-color="#ffffff"></button>
                
                <div class="w-px h-6 bg-slate-700 mx-1"></div>
                
                <input type="color" id="color-picker" value="#05d9e8" title="Custom color">
            </div>

            <!-- Clear Action -->
            <button id="clear-btn" class="flex items-center justify-center gap-2 px-5 py-3 rounded-2xl bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 transition-all active:scale-95 font-medium">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                <span class="hidden sm:inline">Clear</span>
            </button>
        </div>
    </div>

    <!-- Hidden SVG with paths to animate "@neelxz" -->
    <svg id="animation-paths" style="display: none;" viewBox="0 0 400 200">
        <!-- @ symbol -->
        <path class="draw-path" d="M110 120 C80 120, 60 100, 60 80 C60 60, 80 40, 110 40 C140 40, 160 60, 160 80 C160 130, 40 150, 40 80 C40 20, 160 20, 170 70" />
        <!-- n -->
        <path class="draw-path" d="M180 110 C180 80, 190 70, 200 110 C200 80, 210 70, 220 110" />
        <!-- e -->
        <path class="draw-path" d="M230 110 C250 70, 220 70, 220 90 C220 120, 250 120, 260 100" />
        <!-- e -->
        <path class="draw-path" d="M270 110 C290 70, 260 70, 260 90 C260 120, 290 120, 300 100" />
        <!-- l -->
        <path class="draw-path" d="M310 110 C330 30, 310 30, 310 110" />
        <!-- x stroke 1 -->
        <path class="draw-path" d="M330 80 L360 110" />
        <!-- x stroke 2 -->
        <path class="draw-path" d="M360 80 L330 110" />
        <!-- z -->
        <path class="draw-path" d="M370 80 L395 80 L370 110 L395 110" />
    </svg>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('doodle-canvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('canvas-container');
            const colorSwatches = document.querySelectorAll('.color-swatch');
            const colorPicker = document.getElementById('color-picker');
            const clearBtn = document.getElementById('clear-btn');
            const replayBtn = document.getElementById('replay-btn');
            
            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;
            let brushColor = '#05d9e8'; // Initial neon cyan
            let brushSize = 6;
            let animationId = null;

            // Setup Canvas with DPI scaling for crisp lines
            function setupCanvas() {
                const rect = container.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                
                ctx.scale(dpr, dpr);
                canvas.style.width = `${rect.width}px`;
                canvas.style.height = `${rect.height}px`;

                setContextStyles();
            }

            function setContextStyles() {
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';
                ctx.lineWidth = brushSize;
                ctx.strokeStyle = brushColor;
                
                // Add glowing effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = brushColor;
            }

            setupCanvas();

            // Handle window resize gracefully
            window.addEventListener('resize', () => {
                // Save current canvas state
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(canvas, 0, 0);
                
                setupCanvas();
                
                // Restore state
                ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width / (window.devicePixelRatio||1), tempCanvas.height / (window.devicePixelRatio||1));
                setContextStyles();
            });

            function animateSignature() {
                // Cancel any ongoing animation or drawing
                if (animationId) cancelAnimationFrame(animationId);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                const paths = document.querySelectorAll('.draw-path');
                const speed = 4; // Pixels per frame
                
                let currentPathIndex = 0;
                let currentLength = 0;
                let lastDrawX = null;
                let lastDrawY = null;

                // Center the animation based on screen size
                const rect = container.getBoundingClientRect();
                const scale = Math.min(rect.width / 500, rect.height / 300); 
                const offsetX = (rect.width - (400 * scale)) / 2;
                const offsetY = (rect.height - (200 * scale)) / 2;

                setContextStyles();

                function drawFrame() {
                    if (currentPathIndex >= paths.length) {
                        return; // Animation complete
                    }

                    const pathEl = paths[currentPathIndex];
                    const totalLength = pathEl.getTotalLength();
                    
                    if (currentLength === 0) {
                        const startPt = pathEl.getPointAtLength(0);
                        lastDrawX = startPt.x * scale + offsetX;
                        lastDrawY = startPt.y * scale + offsetY;
                    }

                    currentLength += speed;
                    let finishedPath = false;

                    if (currentLength >= totalLength) {
                        currentLength = totalLength;
                        finishedPath = true;
                    }
                    
                    ctx.beginPath();
                    ctx.moveTo(lastDrawX, lastDrawY);
                    
                    const pt = pathEl.getPointAtLength(currentLength);
                    const newX = pt.x * scale + offsetX;
                    const newY = pt.y * scale + offsetY;
                    
                    ctx.lineTo(newX, newY);
                    ctx.stroke();
                    
                    lastDrawX = newX;
                    lastDrawY = newY;

                    if (finishedPath) {
                        currentPathIndex++;
                        currentLength = 0;
                        lastDrawX = null; // Reset for next stroke
                    }
                    
                    animationId = requestAnimationFrame(drawFrame);
                }
                
                animationId = requestAnimationFrame(drawFrame);
            }

            // Start animation slightly after load
            setTimeout(animateSignature, 300);
            replayBtn.addEventListener('click', animateSignature);

            function getPointerPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            function startPosition(e) {
                // Stop animation if user interacts
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }

                isDrawing = true;
                const { x, y } = getPointerPos(e);
                [lastX, lastY] = [x, y];
                
                setContextStyles(); // Ensure current color/glow is applied
                
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(lastX, lastY);
                ctx.stroke();
            }

            function draw(e) {
                if (!isDrawing) return;
                e.preventDefault(); // Prevent scrolling/pull-to-refresh
                
                const { x, y } = getPointerPos(e);

                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.stroke();

                [lastX, lastY] = [x, y];
            }

            function endPosition() {
                isDrawing = false;
                ctx.beginPath();
            }

            // Event Listeners for Mouse
            canvas.addEventListener('mousedown', startPosition);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', endPosition);
            canvas.addEventListener('mouseout', endPosition);

            // Event Listeners for Touch
            canvas.addEventListener('touchstart', startPosition, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', endPosition);
            canvas.addEventListener('touchcancel', endPosition);

            function updateColor(color) {
                brushColor = color;
                setContextStyles();
                
                // Update UI visually
                colorSwatches.forEach(swatch => {
                    swatch.classList.remove('active');
                    swatch.style.boxShadow = 'none';
                    if (swatch.dataset.color === color) {
                        swatch.classList.add('active');
                        swatch.style.boxShadow = `0 0 15px ${color}`;
                    }
                });
                colorPicker.value = color;
            }

            // Predefined swatches
            colorSwatches.forEach(swatch => {
                swatch.addEventListener('click', (e) => {
                    updateColor(e.target.dataset.color);
                });
            });

            // Native color picker
            colorPicker.addEventListener('input', (e) => {
                const color = e.target.value;
                brushColor = color;
                setContextStyles();
                
                // Clear active states on predefined swatches since a custom color is picked
                colorSwatches.forEach(s => {
                    s.classList.remove('active');
                    s.style.boxShadow = 'none';
                });
            });

            // Clear button with fade effect
            clearBtn.addEventListener('click', () => {
                if (animationId) cancelAnimationFrame(animationId);
                
                canvas.style.transition = 'opacity 0.3s ease';
                canvas.style.opacity = '0';
                
                setTimeout(() => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    canvas.style.opacity = '1';
                }, 300);
                
                // Remove inline transition after it runs so drawing is instant
                setTimeout(() => {
                    canvas.style.transition = '';
                }, 600);
            });
        });
    </script>
</body>
</html>
